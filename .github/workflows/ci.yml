name: CI & Separate Wheel Build

on:
  workflow_dispatch:

jobs:
  # --- STAGE 1: PRE-BUILD TEST EXTENSION CONTIGUITY ---
  test:
    name: Test on ${{ matrix.os }} (Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [
          ubuntu-latest,
          ubuntu-24.04-arm,
          windows-latest,
          windows-11-arm,   # Runs natively on Windows ARM64 hardware!
          macos-15-intel,
          macos-latest
        ]
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Dependencies
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-py${{ matrix.python-version }}

      - name: Install Build & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin pytest numpy>=2.0.0

      - name: Compile and Link Extension
        run: maturin build --release --out dist

      - name: Execute PyTest Suite
        run: |
          python -m pip install --no-index --find-links=dist/ pcv_voxel_downsample
          pytest tests/

  # --- STAGE 2: COMPILE, BUNDLE & POST-BUILD VERIFY WHEELS ---
  build-wheels:
    name: Wheel ${{ matrix.os }} (${{ matrix.target }}) - Py ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
        os: [
          ubuntu-latest, 
          ubuntu-24.04-arm, 
          windows-latest, 
          windows-11-arm,   # Native builder for Windows ARM64
          macos-15-intel, 
          macos-latest
        ]
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64
          - os: windows-latest
            target: x64
          - os: windows-11-arm
            target: aarch64
          - os: macos-15-intel
            target: x86_64
          - os: macos-latest
            target: aarch64

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6

      - name: Set up Target Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # No special cross-compile targets required anymore; everything compiles natively!
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Construct Target Wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --interpreter python${{ matrix.python-version }}
          target: ${{ matrix.target }}

      # Verification now runs on ALL systems since they are all native environments!
      - name: Install and Verify Wheel Locally
        working-directory: tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy>=2.0.0
          python -m pip install --no-index --find-links=../dist/ pcv_voxel_downsample
          pytest test_voxel_downsample.py

      - name: Upload Finished Wheel Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}-py${{ matrix.python-version }}
          path: dist/*.whl
